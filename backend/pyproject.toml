[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nightshift"
version = "0.1.0"
description = "Night-Shift Desktop backend engine and pywebview bridge"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]
package = [
    "pyinstaller==6.22.3",
    "pywebview==6.2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nightshift*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
