name: Desktop build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Design gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_tokens.py
      - run: python scripts/check_ui_rules.py

  backend:
    name: Engine tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('backend/pyproject.toml') != ''
        with:
          python-version: "3.12"
      - if: hashFiles('backend/pyproject.toml') != ''
        run: python -m pip install -e "backend[dev]"
      - if: hashFiles('backend/pyproject.toml') != ''
        run: python -m pytest -q backend/tests

  frontend:
    name: UI tests and screenshots
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: "22"
      - name: Install, lint, typecheck, test, build, screenshots
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          npm run tokens
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Upload UI screenshots
        if: always() && hashFiles('frontend/package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: frontend/screenshots/
          if-no-files-found: ignore

  package:
    name: Windows package
    runs-on: windows-latest
    needs: [gates, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('backend/packaging/nightshift.spec') != ''
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: hashFiles('backend/packaging/nightshift.spec') != ''
        with:
          node-version: "22"
      - name: Build NightShift.exe
        if: hashFiles('backend/packaging/nightshift.spec') != ''
        shell: pwsh
        run: |
          Push-Location frontend; npm ci; npm run tokens; npm run build; Pop-Location
          python -m pip install -e "backend[dev,package]"
          python -m PyInstaller --noconfirm backend/packaging/nightshift.spec
          Compress-Archive -Path dist/NightShift/* -DestinationPath NightShift-windows.zip
      - uses: actions/upload-artifact@v4
        if: hashFiles('backend/packaging/nightshift.spec') != ''
        with:
          name: nightshift-windows
          path: NightShift-windows.zip
